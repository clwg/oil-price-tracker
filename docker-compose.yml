services:
  db:
    image: postgres:17-alpine
    container_name: oil-prices-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil}
      POSTGRES_DB: ${POSTGRES_DB:-oil}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oil} -d ${POSTGRES_DB:-oil}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./web
    container_name: oil-prices-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-oil}:${POSTGRES_PASSWORD:-oil}@db:5432/${POSTGRES_DB:-oil}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
