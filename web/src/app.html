<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Same mark as the header. Heavier stroke so it survives 16px, and the
		     accent blue reads on both light and dark browser chrome. -->
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 20'%3E%3Cpath d='M2 15 L7 10 L11 13 L17 5' fill='none' stroke='%232a78d6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='5' r='3' fill='%232a78d6'/%3E%3C/svg%3E"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="U.S. petroleum supply, stocks, refining and prices from the EIA Weekly Petroleum Status Report." />
		<script>
			// Apply the stored theme before first paint so there is no flash.
			try {
				const stored = localStorage.getItem('theme');
				if (stored) document.documentElement.dataset.theme = stored;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
